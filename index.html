<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeaCox</title>
  <meta name="description" content="BeaCox's Homepage">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container" id="app"></main>
  <footer class="footer" id="footer"></footer>
  <noscript><p style="text-align:center;padding:4rem">Please enable JavaScript.</p></noscript>

  <script>
  var ICONS = {
    github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
    rss: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>',
    discord: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    blog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
  };

  function slugify(t) {
    return t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function inline(t) {
    return t
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function parseTable(text) {
    var rows = text.split("\n").filter(function (l) {
      return l.trim() && !/^\|[\s\-|]+$/.test(l);
    });
    if (!rows.length) return "";
    var head = rows[0].split("|").filter(Boolean).map(function (c) { return c.trim(); });
    var html = "<table><thead><tr>" + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr></thead><tbody>";
    rows.slice(1).forEach(function (row) {
      var cells = row.split("|").filter(Boolean).map(function (c) { return c.trim(); });
      html += "<tr>" + cells.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
    });
    return html + "</tbody></table>";
  }

  function parseList(text) {
    var items = text.split("\n").filter(function (l) { return l.trim(); });
    return "<ul>" + items.map(function (l) {
      return "<li>" + inline(l.replace(/^- /, "")) + "</li>";
    }).join("") + "</ul>";
  }

  function parseParagraphs(text) {
    return text.split(/\n\n+/).filter(Boolean).map(function (p) {
      return "<p>" + inline(p.trim().replace(/\n/g, "<br>")) + "</p>";
    }).join("");
  }

  function render(raw) {
    var fm = {};
    var body = raw;
    var m = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    if (m) {
      m[1].split("\n").forEach(function (line) {
        var i = line.indexOf(":");
        if (i > 0) fm[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
      body = m[2];
    }

    var app = document.getElementById("app");

    var sections = [];
    var cur = null;
    body.split("\n").forEach(function (line) {
      var hm = line.match(/^## (.+?)(?:\s*\{\.(\S+)\})?\s*$/);
      if (hm) {
        cur = { title: hm[1].trim(), cls: hm[2] || "", lines: [] };
        sections.push(cur);
      } else if (cur) {
        cur.lines.push(line);
      }
    });

    // Profile
    var profile = document.createElement("header");
    profile.className = "profile";
    profile.innerHTML =
      '<img class="avatar" src="' + (fm.avatar || "") + '" alt="' + (fm.handle || "") + '">' +
      '<h1 class="handle">' + (fm.handle || "") + "</h1>" +
      (fm.name ? '<p class="real-name">' + fm.name + "</p>" : "") +
      '<p class="motto">' + (fm.motto || "") + "</p>";
    app.appendChild(profile);

    var content = document.createElement("div");
    content.className = "content";
    app.appendChild(content);

    // Sections
    var sectionEls = [];
    sections.forEach(function (s) {
      var text = s.lines.join("\n").trim();
      if (!text) return;

      // Links section → nav pills
      if (s.title === "Links") {
        var linksNav = document.createElement("nav");
        linksNav.className = "links";
        var linksHtml = "";
        text.split("\n").forEach(function (line) {
          var lm = line.match(/^- \[(.+?)]\((.+?)\)\s*\{(\w+)}/);
          if (lm) {
            linksHtml += '<a href="' + lm[2] + '" target="_blank" rel="noopener">' +
              (ICONS[lm[3]] || "") + lm[1] + "</a>";
          }
        });
        linksNav.innerHTML = linksHtml;
        profile.appendChild(linksNav);
        return;
      }

      // Content sections
      var id = slugify(s.title);
      var el = document.createElement("section");
      el.className = "section" + (s.cls ? " " + s.cls : "");
      el.id = id;

      var html;
      if (text.charAt(0) === "|") {
        html = parseTable(text);
      } else if (text.split("\n").filter(function (l) { return l.trim(); }).every(function (l) { return /^- /.test(l); })) {
        html = parseList(text);
      } else {
        html = parseParagraphs(text);
      }

      el.innerHTML = '<h2 class="section-title">' + s.title + '</h2><div class="section-content">' + html + "</div>";
      content.appendChild(el);
      sectionEls.push({ id: id, title: s.title, el: el });
    });

    // Sidebar nav
    var divider = document.createElement("hr");
    divider.className = "sidebar-divider";
    profile.appendChild(divider);
    var sideNav = document.createElement("nav");
    sideNav.className = "sidebar-nav";
    sideNav.innerHTML = sectionEls.map(function (s) {
      return '<a href="#' + s.id + '">' + s.title + "</a>";
    }).join("");
    profile.appendChild(sideNav);

    // Scroll spy
    function updateNav() {
      var offset = 80;
      var current = "";
      sectionEls.forEach(function (s) {
        if (s.el.offsetTop - offset <= window.scrollY) current = s.id;
      });
      sideNav.querySelectorAll("a").forEach(function (a) {
        a.classList.toggle("active", a.getAttribute("href") === "#" + current);
      });
    }
    window.addEventListener("scroll", updateNav, { passive: true });
    updateNav();

    // Footer
    var footer = document.getElementById("footer");
    var year = new Date().getFullYear();
    var range = String(fm.startYear) === String(year) ? year : (fm.startYear || year) + "–" + year;
    footer.innerHTML = '<p>© ' + range + ' <a href="' + (fm.url || "#") + '">' + (fm.handle || "") + "</a></p>";

    document.title = fm.handle || "Homepage";
  }

  fetch("config.md").then(function (r) { return r.text(); }).then(render);
  </script>
</body>
</html>
